server:
  port: ${PORT:3100}

spring:
  application:
    name: elderlycare-backend
  config:
    import: optional:file:./config/email-local.properties
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:elderly}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Hong_Kong
    username: ${DB_USERNAME:elderlyservice}
    password: ${DB_PASSWORD:D1aoX0137}
  jpa: 
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        format_sql: true
  sql:
    init:
      mode: never
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:michaelfmikechen@gmail.com}
    password: ${SMTP_PASSWORD:accclyfmemsyxtti}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          ssl:
            enable: ${SMTP_SSL_ENABLED:true}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}

app:
  cors:
    allowed-origin-patterns: "*"
  http-logging:
    enabled: true
    max-body-length: 4000
  mqtt-broker:
    auto-start: ${MQTT_BROKER_AUTO_START:true}
    host: ${MQTT_BROKER_HOST:127.0.0.1}
    port: ${MQTT_BROKER_PORT:1883}
    executable: ${MOSQUITTO_EXECUTABLE:C:/Program Files/Mosquitto/mosquitto.exe}
    config-file: ${MOSQUITTO_CONFIG_FILE:../indoor-positioning/mosquitto.conf}
    log-file: ${MOSQUITTO_LOG_FILE:./.runtime/mosquitto.log}
    startup-timeout: ${MQTT_BROKER_STARTUP_TIMEOUT:5s}
  positioning:
    enabled: true
    mqtt-host: ${POSITIONING_MQTT_HOST:localhost}
    mqtt-port: ${POSITIONING_MQTT_PORT:1883}
    mqtt-topic: ${POSITIONING_MQTT_TOPIC:indoor/location/target_01}
    mqtt-client-id: ${POSITIONING_MQTT_CLIENT_ID:elderlycare-position-bridge}
    mqtt-username: ${POSITIONING_MQTT_USERNAME:}
    mqtt-password: ${POSITIONING_MQTT_PASSWORD:}
    simulator:
      enabled: ${POSITIONING_SIMULATOR_ENABLED:false}
      interval-ms: ${POSITIONING_SIMULATOR_INTERVAL_MS:2000}
  indoor-layout:
    storage-file: ${INDOOR_LAYOUT_STORAGE_FILE:./data/indoor-layout-active.json}
  ai:
    enabled: ${AI_ANALYSIS_ENABLED:true}
    zhipu-api-key: ${ZHIPU_API_KEY:}
    endpoint: ${ZHIPU_API_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/chat/completions}
    model: ${ZHIPU_MODEL:glm-4-flash}
  ai-alert:
    enabled: ${AI_ALERT_MQTT_ENABLED:true}
    mqtt-url: ${AI_ALERT_MQTT_URL:tcp://127.0.0.1:1883}
    default-watch-id: ${AI_ALERT_DEFAULT_WATCH_ID:real-watch-001}
  heart-rate-simulation:
    enabled: ${HEART_RATE_SIMULATION_ENABLED:true}
    mqtt-url: ${HEART_RATE_SIMULATION_MQTT_URL:tcp://127.0.0.1:1883}
    topic: ${HEART_RATE_SIMULATION_TOPIC:indoor/simulation/heart-rate}
    default-watch-id: ${HEART_RATE_SIMULATION_DEFAULT_WATCH_ID:real-watch-001}
    default-bpm: ${HEART_RATE_SIMULATION_DEFAULT_BPM:145}
  email-alert:
    heart-rate-enabled: ${HEART_RATE_EMAIL_ENABLED:true}
    to: ${HEART_RATE_ALERT_EMAIL_TO:michaelfmikechen@outlook.com}
    from: ${HEART_RATE_ALERT_EMAIL_FROM:michaelfmikechen@gmail.com}
  auth:
    token-ttl: 12h
    accounts:
      - username: admin
        password: admin123
        display-name: System Administrator
        role: ADMIN
      - username: john
        password: john123
        display-name: John Doe
        role: RESIDENT_VIEWER
        resident-id: 1
        resident-name: John Doe
        watch-id: real-watch-001
      - username: jane
        password: jane123
        display-name: Jane Smith
        role: RESIDENT_VIEWER
        resident-id: 2
        resident-name: Jane Smith
        watch-id: real-watch-002
      - username: demo
        password: demo123
        display-name: Demo Patient
        role: RESIDENT_VIEWER
        resident-id: 5
        resident-name: Demo Patient
        watch-id: demo-watch-001
